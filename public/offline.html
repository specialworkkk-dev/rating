<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>You’re offline · Review Booster</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #fafaf9; color: #1c1917;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
      }
      .card {
        max-width: 380px; width: 100%; text-align: center; background: #fff; border-radius: 24px;
        padding: 40px 28px; box-shadow: 0 1px 2px rgba(0,0,0,.05); border: 1px solid #e7e5e4;
      }
      svg { display: block; margin: 0 auto; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { margin: 0; color: #78716c; line-height: 1.5; }
      button {
        margin-top: 24px; border: 0; border-radius: 12px; background: #1c1917; color: #fff;
        font: inherit; font-weight: 600; padding: 12px 22px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <!-- Drawn inline: offline, nothing else can be loaded. -->
      <svg viewBox="0 0 40 40" width="64" height="64" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#f59e0b" />
        <path fill="#fff" d="M20 9.5l3.2 6.5 7.2 1-5.2 5.1 1.2 7.1L20 25.8l-6.4 3.4 1.2-7.1L9.6 17l7.2-1L20 9.5z" />
      </svg>
      <h1>You’re offline</h1>
      <p>Review Booster needs the internet to show your latest ratings and messages. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
